
services:
  app:
    build: .
    container_name: incident-manager
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://incident:${DB_PASSWORD}@db:5432/incidents
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: incident-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: incidents
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incidents"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
