services:
  app:
    image: ghcr.io/cc0a/cicd-docker-python-issue-tracker-app:${IMAGE_TAG:-latest}
    container_name: cloud-incident-manager
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_SECRET_ARN: ${DATABASE_SECRET_ARN:?DATABASE_SECRET_ARN must be set}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
