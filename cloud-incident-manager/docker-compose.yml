services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloud-incident-manager

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      DATABASE_URL: sqlite:////app/data/incidents.db

    volumes:
      - incident_data:/app/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  incident_data:
