
name: Cloud Incident Manager CI

on:
  push:
    branches:
      - main
    paths:
      - "cloud-incident-manager/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "cloud-incident-manager/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python Quality and Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: cloud-incident-manager

    env:
      DATABASE_URL: sqlite:///./ci-test.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cloud-incident-manager/requirements.dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Ruff lint
        run: python -m ruff check app tests

      - name: Ruff formatting
        run: python -m ruff format --check app tests

      - name: Bandit security scan
        run: python -m bandit -r app -ll

      - name: Dependency vulnerability scan
        run: python -m pip_audit -r requirements.dev.txt

      - name: Run application tests
        run: python -m pytest -v

  docker-build:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./cloud-incident-manager
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
