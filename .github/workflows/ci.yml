
name: Cloud Incident Manager CI

on:
  push:
    branches:
      - main
    paths:
      - "cloud-incident-manager/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "cloud-incident-manager/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python Quality and Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: cloud-incident-manager

    env:
      DATABASE_URL: sqlite:///./ci-test.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cloud-incident-manager/requirements.dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff formatting
        run: ruff format --check app tests

      - name: Bandit security scan
        run: bandit -r app -ll

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.dev.txt

      - name: Run application tests
        run: python -m pytest -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            --tag cloud-incident-manager:${{ github.sha }} \
            ./cloud-incident-manager
