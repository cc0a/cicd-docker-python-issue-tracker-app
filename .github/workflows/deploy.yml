name: Deploy Cloud Incident Manager

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-incident-manager-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_WORKING_DIR: cloud-incident-manager/terraform/environments/dev

jobs:
  deploy:
    name: Deploy to EC2 through SSM
    runs-on: ubuntu-latest
    environment: terraform-apply
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsTerraformApply
          aws-region: ${{ env.AWS_REGION }}

      - name: Read infrastructure outputs
        id: tf
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false
          echo "instance_id=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"
          echo "app_port=$(terraform output -raw app_port)" >> "$GITHUB_OUTPUT"

      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ steps.tf.outputs.instance_id }}
          APP_PORT: ${{ steps.tf.outputs.app_port }}
          IMAGE_TAG: latest
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/deploy-command.sh <<SCRIPT
          set -eu
          export APP_PORT="${APP_PORT}"
          export IMAGE_TAG="${IMAGE_TAG}"

          mkdir -p /opt/cloud-incident-manager
          cd /opt/cloud-incident-manager

          printf 'APP_PORT=%s\\nIMAGE_TAG=%s\\n' \
            "\$APP_PORT" "\$IMAGE_TAG" > .env

          curl -fsSL \
            https://raw.githubusercontent.com/cc0a/cicd-docker-python-issue-tracker-app/main/cloud-incident-manager/docker-compose.yml \
            -o docker-compose.yml

          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps

          curl --fail --retry 10 --retry-delay 5 \
            "http://127.0.0.1:\$APP_PORT/api/health/"
          SCRIPT

          jq -n --rawfile command /tmp/deploy-command.sh \
            '{commands: [$command]}' > /tmp/ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Cloud Incident Manager $IMAGE_TAG" \
            --parameters file:///tmp/ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,Output:StandardOutputContent}" \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for deployment."
          exit 1
